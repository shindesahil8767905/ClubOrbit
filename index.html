                                                defaultValue="sahil.shinde@cluborbit.io"
                                                required 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 outline-none focus:border-brand-500 focus:bg-white"
                                            />
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-center mb-1">
                                                <label className="block text-xs font-bold text-slate-700">Password</label>
                                                <button type="button" onClick={() => setAuthMode('forgot')} className="text-[11px] text-brand-600 hover:text-brand-700 font-bold cursor-pointer">Forgot password?</button>
                                            </div>
                                            <div className="relative">
                                                <input 
                                                    type={showPassword ? "text" : "password"} 
                                                    name="password" 
                                                    defaultValue="password123"
                                                    required 
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 outline-none focus:border-brand-500 focus:bg-white pr-9"
                                                />
                                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-2 text-slate-400 hover:text-slate-600 text-xs">
                                                    {showPassword ? "🙈" : "👁️"}
                                                </button>
                                            </div>
                                        </div>
                                        <div className="flex items-center justify-between text-xs text-slate-600 pt-0.5">
                                            <label className="flex items-center gap-2 cursor-pointer select-none">
                                                <input type="checkbox" defaultChecked className="rounded border-slate-300 text-brand-600" />
                                                <span className="text-[11px]">Remember me on this browser</span>
                                            </label>
                                        </div>
                                        <Button variant="primary" size="md" type="submit" disabled={isAuthenticating} className="w-full">
                                            {isAuthenticating ? "Verifying..." : "Sign In to ClubOrbit →"}
                                        </Button>
                                    </form>
                                )}

                                {/* TAB: SIGN UP */}
                                {authMode === 'signup' && (
                                    <form onSubmit={(e) => { e.preventDefault(); handleSignUp(e.target.fullName.value, e.target.newEmail.value, e.target.newCraft?.value); }} className="space-y-3.5">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                                            <input 
                                                type="text" 
                                                name="fullName" 
                                                defaultValue="Sahil Shinde"
                                                required 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 outline-none focus:border-brand-500 focus:bg-white"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                                            <input 
                                                type="email" 
                                                name="newEmail" 
                                                defaultValue="sahil.shinde@cluborbit.io"
                                                required 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 outline-none focus:border-brand-500 focus:bg-white"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                                            <div className="relative">
                                                <input 
                                                    type={showPassword ? "text" : "password"} 
                                                    name="newPassword" 
                                                    defaultValue="securepassword"
                                                    required 
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 outline-none focus:border-brand-500 focus:bg-white pr-9"
                                                />
                                                <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-2 text-slate-400 hover:text-slate-600 text-xs">
                                                    {showPassword ? "🙈" : "👁️"}
                                                </button>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Primary Discipline / Focus</label>
                                            <select name="newCraft" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 outline-none focus:border-brand-500 focus:bg-white">
                                                <option value="Technology">Technology & Software Engineering</option>
                                                <option value="Design">Product & UI/UX Design</option>
                                                <option value="Entrepreneurship">Indie Hacking & Startups</option>
                                                <option value="Photography">Visual Arts & Photography</option>
                                                <option value="Music">Sound & Music Production</option>
                                            </select>
                                        </div>
                                        <div className="text-xs text-slate-600 pt-0.5">
                                            <label className="flex items-start gap-2 cursor-pointer select-none">
                                                <input type="checkbox" required defaultChecked className="mt-0.5 rounded border-slate-300 text-brand-600" />
                                                <span className="text-[11px] leading-relaxed">I agree to the Community Code of Conduct and Terms of Service.</span>
                                            </label>
                                        </div>
                                        <Button variant="primary" size="md" type="submit" disabled={isAuthenticating} className="w-full">
                                            {isAuthenticating ? "Creating Account..." : "Create Free Account →"}
                                        </Button>
                                    </form>
                                )}

                                {/* TAB: FORGOT PASSWORD */}
                                {authMode === 'forgot' && (
                                    <form onSubmit={(e) => { e.preventDefault(); notify("Reset instructions sent to " + e.target.resetEmail.value); setAuthMode('signin'); }} className="space-y-4">
                                        <p className="text-xs text-slate-600 leading-relaxed">
                                            Enter your email and we'll send you an encrypted password recovery link.
                                        </p>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                                            <input 
                                                type="email" 
                                                name="resetEmail" 
                                                defaultValue="sahil.shinde@cluborbit.io"
                                                required 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 outline-none focus:border-brand-500 focus:bg-white"
                                            />
                                        </div>
                                        <Button variant="primary" size="md" type="submit" className="w-full">
                                            Send Reset Link
                                        </Button>
                                        <div className="text-center pt-2">
                                            <button type="button" onClick={() => setAuthMode('signin')} className="text-xs text-brand-600 font-bold hover:underline">
                                                ← Back to Sign In
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                    {/* TOAST NOTIFICATION CONTAINER */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 border border-slate-700 animate-bounce">
                            <span className="w-5 h-5 rounded-full bg-brand-500 text-white flex items-center justify-center text-[10px]">✓</span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
